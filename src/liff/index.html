<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>お客様情報のご登録</title>
  <style>
    :root { --accent: #06c755; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0; padding: 16px; background: #f7f7f7; color: #222;
      /* 日本語が語中で改行されないようにする */
      word-break: keep-all; overflow-wrap: break-word;
    }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.1rem; margin: 0 0 12px; }
    p.note { font-size: 0.8rem; color: #666; margin-top: 0; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 14px 0 4px; }
    .required::after { content: " *"; color: #d00; }
    input[type="text"], input[type="tel"], input[type="date"] {
      width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px;
    }
    .consent { display: flex; align-items: flex-start; gap: 8px; margin-top: 16px; font-size: 0.85rem; }
    /* min-width:0 がないと同意文が縮まず、枠からはみ出す */
    .consent input { flex: 0 0 auto; margin-top: 2px; }
    .consent label { flex: 1; min-width: 0; }
    button {
      width: 100%; margin-top: 20px; padding: 12px; font-size: 1rem; font-weight: 700;
      color: #fff; background: var(--accent); border: none; border-radius: 8px;
    }
    button:disabled { background: #aaa; }
    #status { margin-top: 12px; font-size: 0.9rem; text-align: center; }
    #loading { text-align: center; color: #666; font-size: 0.9rem; padding: 24px 0; }
    .hidden { display: none; }
    .link { display: block; margin-top: 14px; text-align: center; color: var(--accent);
            font-weight: 700; text-decoration: underline; }
    #status.error { color: #d00; }
    #status.ok { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">お客様情報のご登録</h1>
    <p class="note" id="lead">ご予約の確認やご案内をお届けするために使用します。</p>
    <div id="loading">読み込み中…</div>
    <form id="form" class="hidden">
      <label class="required" for="name">お名前</label>
      <input type="text" id="name" autocomplete="name" required />

      <label class="required" for="phone">お電話番号</label>
      <input type="tel" id="phone" autocomplete="tel" placeholder="090-1234-5678" required />

      <label for="birthday">お誕生日（任意）</label>
      <input type="date" id="birthday" />

      <div class="consent">
        <input type="checkbox" id="consent" checked />
        <label for="consent" style="margin:0; font-weight:400;">
          キャンペーンやご案内の配信に同意します（予約確認のご連絡は同意の有無に関わらずお送りします）
        </label>
      </div>

      <button type="submit" id="submit">登録する</button>
      <a id="to-reserve" class="link hidden" href="./reserve.html">この内容で予約に進む</a>
      <div id="status"></div>
    </form>
  </div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./app.js"></script>
</body>
</html>
