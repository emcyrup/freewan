# Render (https://render.com) 用 Blueprint。
# ダッシュボードの「New +」→「Blueprint」でこのリポジトリを指定すると
# Web サービスと PostgreSQL がまとめて作成される。
# 注意: Webhook 受信と 10:00 JST のジョブ実行があるため、スリープする Free プランは不可。
services:
  - type: web
    name: cocotte-vert
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/migrate.js && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: TZ
        value: Asia/Tokyo
      - key: SEND_MODE
        value: dry_run
      - key: DATABASE_URL
        fromDatabase:
          name: cocotte-vert-db
          property: connectionString
      # 以下はダッシュボードの Environment で手入力する（値はコミットしない）
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LIFF_ID
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false

databases:
  - name: cocotte-vert-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
